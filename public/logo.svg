<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Hexagon body (amber) -->
  <polygon points="60,28 85,42.5 85,71.5 60,86 35,71.5 35,42.5" fill="#F59E0B"/>

  <!-- Left bracket wing < -->
  <polyline points="30,44 14,57 30,70" stroke="#44403C" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right bracket wing > -->
  <polyline points="90,44 106,57 90,70" stroke="#44403C" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Left antenna -->
  <line x1="48" y1="32" x2="40" y2="18" stroke="#44403C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="40" cy="16" r="4" fill="#44403C"/>

  <!-- Right antenna -->
  <line x1="72" y1="32" x2="80" y2="18" stroke="#44403C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="16" r="4" fill="#44403C"/>

  <!-- Subtle body stripes (darker amber) -->
  <line x1="42" y1="52" x2="78" y2="52" stroke="#D97706" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="40" y1="60" x2="80" y2="60" stroke="#D97706" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="42" y1="68" x2="78" y2="68" stroke="#D97706" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
